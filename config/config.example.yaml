  - { port: 10809, primary: socks5,     also_accept: [http_proxy], enabled: true }
  - { port: 9050,  primary: socks5,     also_accept: [http_proxy], enabled: true }
  - { port: 3128,  primary: http_proxy, also_accept: [socks5],     enabled: true }
